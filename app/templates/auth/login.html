{% extends "base.html" %}
{% block title %}Login - VPOOL{% endblock %}
{% block content %}
<div class="container">
    <div class="card auth-card p-4">
        <h3 class="text-center mb-1">Welcome back</h3>
        <p class="text-center text-muted mb-4">Login to VPOOL</p>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-vp-primary w-100">Login</button>
        </form>
        <div class="d-flex justify-content-between mt-3">
            <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password?</a>
            <a href="{{ url_for('auth.register') }}" class="small">Create an account</a>
        </div>
        <hr>
        <p class="small text-muted mb-0">Demo accounts (after running <code>seed.py</code>): rohan@vpool.com / priya@vpool.com / aman@vpool.com — password: <code>password123</code></p>
    </div>
</div>
{% endblock %}
