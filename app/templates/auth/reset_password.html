{% extends "base.html" %}
{% block title %}Reset Password - VPOOL{% endblock %}
{% block content %}
<div class="container">
    <div class="card auth-card p-4">
        <h3 class="text-center mb-1">Reset your password</h3>
        <p class="text-center text-muted mb-4">Token expires 30 minutes after being generated.</p>
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" minlength="6" required autofocus>
            </div>
            <button type="submit" class="btn btn-vp-primary w-100">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
